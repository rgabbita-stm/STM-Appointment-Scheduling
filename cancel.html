<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cancel Appointment</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f0f2f5; margin: 0; padding: 16px; color: #1c1e21; }
    .card { max-width: 440px; margin: 30px auto; background: #ffffff; padding: 26px; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); text-align: center; }
    h2 { margin: 0 0 12px 0; font-size: 1.3rem; color: #c62828; }
    p { font-size: 0.95rem; color: #444; line-height: 1.5; margin: 8px 0 16px; }
    .btn { width: 100%; border: none; padding: 13px; border-radius: 6px; font-size: 1rem; font-weight: 700; cursor: pointer; }
    .cancel-btn { background: #c62828; color: #ffffff; }
    .cancel-btn:disabled { background: #bbb; cursor: not-allowed; }
    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #fff; border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle; margin-right: 6px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #status { margin-top: 14px; font-size: 0.9rem; }
    .branch-tag { display: inline-block; background: #ffebee; color: #c62828; padding: 4px 10px; border-radius: 4px; font-weight: 600; font-size: 0.85rem; margin-bottom: 12px; }
  </style>
</head>
<body>
  <div class="card" id="cancelCard">
    <h2>Cancel Appointment</h2>
    <div id="branchDisplay" class="branch-tag" style="display:none;"></div>
    <p>Are you sure you want to cancel this service appointment?</p>
    <p style="font-size: 0.85rem; color: #666;">Once cancelled, your reserved 15-minute slot will be released for other customers.</p>
    
    <button id="cancelButton" class="btn cancel-btn" onclick="confirmCancel()">Yes, Cancel My Appointment</button>
    <div id="status"></div>
  </div>

  <script>
    // Paste your Google Apps Script Web App URL below
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx1vAtGC_-S7nQYjE5t8UQKiksu28KJnK5S57YR-z3lSUXmKm-ifaukob46rjj0j1_y/exec";

    const urlParams = new URLSearchParams(window.location.search);
    const eventId = urlParams.get('eventId');
    const branch = urlParams.get('branch');

    window.onload = function() {
      if (!eventId) {
        document.getElementById('cancelCard').innerHTML = `
          <h2 style="color: #666;">Invalid Link</h2>
          <p>No appointment ID was found in this link. It may have already been cancelled or expired.</p>
        `;
        return;
      }
      if (branch) {
        const branchTag = document.getElementById('branchDisplay');
        branchTag.innerText = "Branch: " + branch;
        branchTag.style.display = 'inline-block';
      }
    };

    function confirmCancel() {
      const btn = document.getElementById('cancelButton');
      const status = document.getElementById('status');
      btn.disabled = true;
      status.innerHTML = '<span style="color:#666;">Processing cancellation with calendar...</span>';

      fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        redirect: 'follow',
        body: JSON.stringify({
          action: "cancelBooking",
          eventId: eventId,
          branch: branch
        })
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          document.getElementById('cancelCard').innerHTML = `
            <div style="padding: 10px 0;">
              <h2 style="color: #008a3e;">✓ Appointment Cancelled</h2>
              <p>Your appointment has been cancelled and the slot has been freed on our calendar.</p>
              <p style="font-size: 0.85rem; color: #555;">Thank you for notifying us.</p>
              <a href="index.html" style="display:inline-block; margin-top: 14px; color: #004b93; font-weight: 700; text-decoration: none;">Book a New Appointment →</a>
            </div>
          `;
        } else {
          status.innerHTML = '<span style="color:#c62828">Error: ' + data.message + '</span>';
          btn.disabled = false;
        }
      })
      .catch(err => {
        status.innerHTML = '<span style="color:#c62828">Cancellation failed: ' + err.message + '</span>';
        btn.disabled = false;
      });
    }
  </script>
</body>
</html>
